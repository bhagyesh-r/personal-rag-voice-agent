<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handbook Voice RAG Assistant</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
      .container { max-width: 980px; margin: 0 auto; padding: 20px; }
      .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
      button { padding: 8px 12px; border-radius: 8px; border: 0; cursor: pointer; }
      input, textarea { width: 100%; margin-top: 8px; background: #0b1220; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; padding: 10px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .chat { max-height: 420px; overflow: auto; }
      .msg { padding: 10px; border-radius: 8px; margin-bottom: 8px; }
      .user { background: #1d4ed8; }
      .assistant { background: #065f46; }
      .citations { font-size: 12px; color: #cbd5e1; white-space: pre-wrap; }
      .status { margin-top: 10px; color: #cbd5e1; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Handbook Voice + Text RAG Assistant (MVP)</h1>

      <div class="card">
        <h3>1) Upload Handbook PDF</h3>
        <input id="pdf" type="file" accept="application/pdf" />
        <div class="row" style="margin-top: 8px">
          <button id="uploadButton" type="button">Upload & Index</button>
          <span id="uploadStatus"></span>
        </div>
      </div>

      <div class="card">
        <h3>2) Chat</h3>
        <div class="row">
          <button id="newSessionButton" type="button">New Session</button>
          <button id="voiceToggleButton" type="button">Start Voice Assistant</button>
          <span id="sessionInfo"></span>
        </div>
        <p class="status" id="voiceStatus">Voice assistant is off.</p>
        <div class="chat" id="chat"></div>
        <textarea id="message" rows="3" placeholder="Ask a handbook question..."></textarea>
        <div class="row" style="margin-top: 8px">
          <button id="sendButton" type="button">Send</button>
        </div>
      </div>

      <div class="card">
        <h3>Current Voice Setup</h3>
        <p id="liveInfo">Loading live model config...</p>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
