<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolicyAssistant AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-badge" aria-hidden="true">
            <span class="material-symbols-outlined">bolt</span>
          </div>
          <span class="brand-label">PolicyAssistant AI</span>
        </div>
        <div class="topbar-actions">
          <div class="status-pill">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Core Online</span>
          </div>
          <button
            class="chrome-button"
            type="button"
            disabled
            aria-disabled="true"
            title="Notifications are not available in this version."
          >
            <span class="material-symbols-outlined">notifications</span>
          </button>
          <button
            class="chrome-button"
            type="button"
            disabled
            aria-disabled="true"
            title="Settings are not available in this version."
          >
            <span class="material-symbols-outlined">settings</span>
          </button>
          <div id="sessionInfo" hidden aria-hidden="true"></div>
        </div>
      </header>

      <aside class="sidebar">
        <nav class="sidebar-nav" aria-label="Primary">
          <button class="nav-button active" type="button" aria-current="page">
            <span class="material-symbols-outlined">auto_awesome</span>
            <span class="nav-label">Assistant</span>
          </button>
          <button
            class="nav-button"
            type="button"
            disabled
            aria-disabled="true"
            title="History is not available in this version."
          >
            <span class="material-symbols-outlined">history_edu</span>
            <span class="nav-label">History</span>
          </button>
          <button
            class="nav-button"
            type="button"
            disabled
            aria-disabled="true"
            title="Library is not available in this version."
          >
            <span class="material-symbols-outlined">folder_special</span>
            <span class="nav-label">Library</span>
          </button>
        </nav>

        <div class="sidebar-upload">
          <button class="upload-button" id="uploadButton" type="button">
            <span class="material-symbols-outlined">cloud_upload</span>
            <span class="upload-label">Upload Document</span>
          </button>
          <input id="pdf" class="hidden-input" type="file" accept="application/pdf" />
        </div>

        <div class="resource-card">
          <p class="panel-eyebrow">Resource Load</p>
          <div class="resource-bar" aria-hidden="true">
            <span id="resourceProgress"></span>
          </div>
          <p class="resource-status" id="uploadStatus">No handbook indexed yet.</p>
        </div>
      </aside>

      <main class="workspace">
        <section class="transcript-panel">
          <div class="transcript-toolbar">
            <div>
              <p class="panel-eyebrow">Live Transcript</p>
              <h1 class="panel-title">Assistant</h1>
            </div>
            <button class="toolbar-button" id="newSessionButton" type="button" title="Start a new session">
              <span class="material-symbols-outlined">refresh</span>
              <span class="toolbar-label">New Session</span>
            </button>
          </div>

          <div class="transcript" id="chat" aria-live="polite"></div>

          <div class="composer-wrap">
            <form class="composer" id="composer" autocomplete="off">
              <button class="composer-icon" id="attachButton" type="button" title="Upload a PDF">
                <span class="material-symbols-outlined">attach_file</span>
              </button>
              <input
                id="message"
                type="text"
                placeholder="Type your directive or policy query..."
                autocomplete="off"
              />
              <div class="composer-actions">
                <button class="composer-icon voice-button" id="voiceToggleButton" type="button" title="Toggle voice mode">
                  <span class="material-symbols-outlined" id="voiceToggleIcon">mic</span>
                </button>
                <button class="send-button" id="sendButton" type="submit" title="Send message">
                  <span class="material-symbols-outlined">send</span>
                </button>
              </div>
            </form>
          </div>
        </section>

        <section class="persona-panel" id="voicePanel" data-voice-state="idle">
          <div class="persona-stage">
            <button
              class="persona-core"
              id="personaButton"
              type="button"
              aria-label="Toggle voice assistant"
              aria-pressed="false"
            >
              <div class="voice-bars" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
              </div>
            </button>

            <div class="persona-copy">
              <p class="persona-kicker" id="voiceModeLabel">Standby</p>
              <h2>Active Intelligence</h2>
              <p id="liveInfo">Loading policy context...</p>
              <p class="voice-detail" id="voiceStatus">Voice assistant is off.</p>
            </div>
          </div>
        </section>

        <aside class="reference-rail">
          <div class="reference-header">
            <div class="reference-title">
              <span class="material-symbols-outlined">verified</span>
              <h3>Citations</h3>
            </div>
            <p>Verified sources for current response context.</p>
          </div>

          <div class="citation-list" id="citations"></div>

          <div class="payload-section">
            <p class="panel-eyebrow">Payload Objects</p>
            <div class="payload-list" id="payloadObjects"></div>
          </div>

          <button
            class="export-button"
            type="button"
            disabled
            aria-disabled="true"
            title="Export is not available in this version."
          >
            <span class="material-symbols-outlined">download</span>
            <span>Export Report</span>
          </button>
        </aside>
      </main>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
